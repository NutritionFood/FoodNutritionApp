<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Historial de productos alimenticios consultados."
    >

    <title>Historial - Food Nutrition</title>

    <link
        rel="stylesheet"
        href="../css/common.css"
    >

    <link
        rel="stylesheet"
        href="../css/search.css"
    >

    <link
        rel="stylesheet"
        href="../css/history.css"
    >
</head>

<body>

    <header class="header">

        <div class="container header-top">

            <div class="header-brand">
                <h1>Food Nutrition</h1>

                <p>
                    Información nutricional de productos alimenticios
                </p>
            </div>

            <div id="nav-container"></div>

        </div>

    </header>


    <main class="container">

        <section class="history-section">

            <header class="section-header history-section-header">

                <div>
                    <h2>
                        Historial
                    </h2>

                    <p id="history-count"></p>
                </div>

                <button
                    type="button"
                    id="clear-history-button"
                    class="clear-history-button"
                    hidden
                >
                    Vaciar historial
                </button>

            </header>


            <div
                id="history-container"
            ></div>

        </section>

    </main>


    <footer class="footer">

        <div class="container">

            <p>
                Food Nutrition - Trabajo Práctico Integrador
            </p>

        </div>

    </footer>


    <script
        type="module"
        src="../js/controller/historyController.js"
    ></script>

</body>

</html>
